<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12111c" />
      <stop offset="100%" stop-color="#0a0a10" />
    </linearGradient>
    <linearGradient id="topGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="botGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect x="32" y="32" width="448" height="448" rx="120" fill="url(#bgGrad)" stroke="#a855f7" stroke-width="8" stroke-opacity="0.8"/>
  <g filter="url(#glow)">
    <polygon points="360,130 220,130 160,185 160,240 230,280 270,280 200,235 200,185 235,160 360,160" fill="url(#topGrad)"/>
    <polygon points="150,430 290,430 350,375 350,320 280,280 240,280 310,325 310,375 275,400 150,400" fill="url(#botGrad)"/>
    <polygon points="170,290 340,240 320,270 150,320" fill="#93c5fd"/>
    <circle cx="256" cy="256" r="14" fill="#ffffff"/>
  </g>
</svg>
